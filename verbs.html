  <style>
    /* ── Verbs page fills the viewport below banner + header ── */
    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    /* ── Two-panel layout ── */
    .verbs-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-search {
      padding: 10px 10px 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #search-input {
      font-family: var(--font);
      font-size: 0.82rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      color: var(--text);
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    #search-input:focus {
      border-color: var(--accent);
    }

    #search-input::placeholder {
      color: var(--muted);
    }

    #verb-list {
      overflow-y: auto;
      flex: 1;
      padding: 8px 0 24px;
    }

    .sidebar-group {
      margin-bottom: 4px;
    }

    .group-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 14px 4px;
      display: block;
    }

    .verb-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 12px 6px 14px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }

    .verb-item:hover {
      background: rgba(139, 105, 20, 0.07);
    }

    .verb-item.active {
      border-left-color: var(--accent);
      background: rgba(139, 105, 20, 0.11);
    }

    .verb-oe {
      font-size: 0.875rem;
      font-style: italic;
      color: var(--text);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .verb-item.active .verb-oe {
      font-style: normal;
      font-weight: 700;
    }

    .no-results {
      font-size: 0.8rem;
      font-style: italic;
      color: var(--muted);
      padding: 16px 14px;
    }

    /* ── Right panel: verb display + footer ── */
    .verbs-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      min-width: 0;
    }

    #main-content {
      flex: 1;
      padding: 36px 44px 48px;
    }

    .verbs-right .site-footer {
      margin-top: 0;
    }

    /* ── Verb view ── */
    .verb-view {
      max-width: 740px;
    }

    .verb-header {
      margin-bottom: 28px;
    }

    .verb-heading-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 8px;
    }

    .verb-headword {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
    }

    .verb-gloss {
      font-size: 1.05rem;
      font-style: italic;
      color: var(--muted);
    }

    .verb-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag-pattern {
      font-size: 0.65rem;
      font-family: 'Courier New', Courier, monospace;
      background: #ece5d1;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 2px 7px;
      line-height: 1.5;
    }

    /* ── Conjugation grid ── */
    .conj-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px 36px;
      margin-bottom: 28px;
    }

    .conj-section {
      min-width: 0;
    }

    .section-head {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      padding-bottom: 5px;
      border-bottom: 1px solid var(--accent);
      margin-bottom: 6px;
    }

    .conj-table {
      width: 100%;
      border-collapse: collapse;
    }

    .conj-table tr {
      border-bottom: 1px solid #e0d9c8;
    }

    .conj-table tr:last-child {
      border-bottom: none;
    }

    .conj-table td {
      padding: 5px 0;
      vertical-align: middle;
    }

    .conj-label {
      font-size: 0.72rem;
      font-style: italic;
      color: var(--muted);
      width: 88px;
      padding-right: 8px;
      white-space: nowrap;
    }

    .conj-col-head {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 3px 0 5px;
      border-bottom: 1px solid #e0d9c8;
    }

    .conj-form {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    /* ── Non-finite & Imperative tiles ── */
    .nonfinite-section {
      margin-top: 4px;
    }

    .nonfinite-head {
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      padding-bottom: 5px;
      border-bottom: 1px solid var(--accent);
      margin-bottom: 14px;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .tile {
      background: #ece5d1;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px 11px;
    }

    .tile-label {
      font-size: 0.62rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .tile-form {
      font-size: 0.93rem;
      font-weight: 700;
      color: var(--text);
    }

    /* ── Loading / error placeholder ── */
    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--muted);
      font-style: italic;
      font-size: 1rem;
      text-align: center;
      line-height: 1.7;
    }

    .placeholder code {
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
      font-style: normal;
      background: #e8e0cc;
      padding: 2px 6px;
      border-radius: 3px;
    }

    /* ── Ablaut / stem pattern label ── */
    .pattern-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pattern-label {
      font-size: 0.65rem;
      font-style: italic;
      color: var(--muted);
    }

    /* ── Tooltips ── */
    [data-tip] {
      cursor: help;
    }

    .oe-tooltip {
      position: fixed;
      z-index: 9999;
      background: #f5edd9;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.78rem;
      line-height: 1.6;
      padding: 8px 12px;
      max-width: 280px;
      box-shadow: 0 2px 10px rgba(30, 21, 8, 0.1);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease;
      border-radius: 3px;
    }

    /* ── Notes ── */
    .verb-notes {
      margin-top: 20px;
      padding: 12px 16px;
      background: #f5edd9;
      border-left: 3px solid var(--accent);
      border-radius: 0 4px 4px 0;
    }

    .verb-notes p {
      margin: 0;
      font-size: 0.875rem;
      font-style: italic;
      color: var(--text);
      line-height: 1.65;
    }

    /* ── Source tags ── */
    .verb-sources {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #e8dfc8;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sources-label {
      font-size: 0.65rem;
      font-style: italic;
      color: var(--muted);
      flex-shrink: 0;
    }

    .tag-source {
      font-size: 11px;
      background: #e8f0f5;
      color: #2a4a5a;
      border: 1px solid #a0bcc8;
      border-radius: 5px;
      padding: 3px 10px;
      white-space: nowrap;
    }

    /* ── Scrollbars ── */
    #verb-list::-webkit-scrollbar,
    .verbs-right::-webkit-scrollbar {
      width: 5px;
    }

    #verb-list::-webkit-scrollbar-track,
    .verbs-right::-webkit-scrollbar-track {
      background: transparent;
    }

    #verb-list::-webkit-scrollbar-thumb,
    .verbs-right::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* ── Mobile (≤ 768px) ── */
    @media (max-width: 768px) {

      /* Allow the page to scroll naturally */
      html,
      body {
        height: auto;
        overflow: auto;
      }

      /* Stack sidebar above content */
      .verbs-layout {
        flex-direction: column;
        overflow: visible;
      }

      /* Sidebar: full width, horizontal strip */
      #sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
        height: auto;
        overflow: visible;
      }

      /* Search: stretch to full width */
      .sidebar-search {
        padding: 10px 16px;
        border-bottom: none;
      }

      /* Verb strip: horizontal scroll lane */
      #verb-list {
        display: flex;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0 4px 4px;
        flex: none;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      #verb-list::-webkit-scrollbar {
        display: none;
      }

      /* Flatten group structure for strip layout */
      .sidebar-group {
        display: contents;
      }

      .group-label {
        display: none;
      }

      /* Compact horizontal verb items */
      .verb-item {
        flex-shrink: 0;
        border-left: none;
        border-bottom: 3px solid transparent;
        padding: 6px 12px 5px;
      }

      .verb-item.active {
        border-bottom-color: var(--accent);
      }

      .verb-item .tag {
        display: none;
      }

      /* Right panel: full width, natural page scroll */
      .verbs-right {
        overflow-y: visible;
      }

      #main-content {
        padding: 24px 16px 40px;
      }

      /* Conjugation grid → single column */
      .conj-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      /* Tile grid → two columns */
      .tile-grid {
        grid-template-columns: 1fr 1fr;
      }

      /* Typography */
      .verb-headword {
        font-size: 1.3rem;
      }

      .conj-label {
        font-size: 0.76rem;
      }

      .conj-form {
        font-size: 0.875rem;
      }

      .tile-form {
        font-size: 0.875rem;
      }
    }
  </style>
</head>

  <div class="verbs-layout">

  <script src="paradigm.js"></script>
  <script>
    let verbs = [];
    let familyMap = {};   // id → related ids (derived prefix families, base first)

    // Derived prefix family plus any hand-curated `related` extras, deduped.
    function relatedIdsFor(verb) {
      const fam = familyMap[verb.id] || [];
      const seen = new Set(fam);
      seen.add(verb.id);
      return fam.concat((verb.related || []).filter(id => !seen.has(id)));
    }
    let activeId = null;

    function tagClass(type) {
      return {
        strong: 'tag-strong',
        weak1: 'tag-weak',
        weak2: 'tag-weak',
        'preterite-present': 'tag-pret',
        irregular: 'tag-irreg'
      }[type] || 'tag-strong';
    }

    function typeLabel(verb, classLabel) {
      if (verb.type === 'strong') return classLabel || 'Strong';
      if (verb.type === 'weak1') return 'Weak I';
      if (verb.type === 'weak2') return 'Weak II';
      if (verb.type === 'preterite-present') return 'Pret.-Pres.';
      if (verb.type === 'irregular') return 'Irregular';
      return verb.type;
    }

    function row(label, form) {
      return `<tr><td class="conj-label">${label}</td><td class="conj-form">${form || '—'}</td></tr>`;
    }

    function rowDual(label, form1, form2) {
      return `<tr><td class="conj-label">${label}</td><td class="conj-form">${form1 || '—'}</td><td class="conj-form">${form2 || '—'}</td></tr>`;
    }

    const TIPS = {
      pres_ind: 'States facts and real events in the present. The default mood for ordinary statements.',
      past_ind: 'States facts and real events in the past. The default mood for ordinary past statements.',
      pres_subj: 'Expresses present possibility, doubt, wishes, or indirect speech. Used where something is not stated as straightforwardly real.',
      past_subj: 'Expresses past possibility, doubt, wishes, or indirect speech. Often found in hypothetical or reported constructions.',
      infinitive: "The base verb form. Equivalent to modern 'to sing' in its plain sense — used after verbs of wanting, intending, or ability.",
      inf_infl: "Used to express purpose or intention. Formed with tō + the -enne ending. Equivalent to 'in order to sing' or 'for the purpose of singing'.",
      pres_part: "Describes an ongoing action, equivalent to the modern -ing form. Used attributively ('the singing man') or adverbially ('he came singing').",
      past_part: "Describes a completed action. Used in passive and perfect constructions ('the song was sung', 'he had sung'). Typically formed with the ġe- prefix.",
      imperative: 'The command form. Singular for one person, plural for a group.'
    };

    const SOURCE_NAMES = { 'osweald-bera': 'Ōsweald Bera' };

    function section(title, rows, tip) {
      const tipAttr = tip ? ` data-tip="${tip}"` : '';
      return `<div class="conj-section">
        <div class="section-head"${tipAttr}>${title}</div>
        <table class="conj-table">${rows}</table>
      </div>`;
    }

    function tile(label, form, tip) {
      const tipAttr = tip ? ` data-tip="${tip}"` : '';
      return `<div class="tile">
        <div class="tile-label"${tipAttr}>${label}</div>
        <div class="tile-form">${form || '—'}</div>
      </div>`;
    }

    // Computed from this verb's own principalParts (same vowel-extraction
    // logic Paradigm.inferClass uses internally) rather than looked up by
    // class label — several classes (IIIb, IV, V, VI, VII) don't have one
    // uniform vowel series across every verb in the class.
    function seriesVowelsLabel(verb) {
      const vowels = Paradigm.computeSeriesVowels(verb.principalParts, verb);
      if (vowels.some(v => v == null)) {
        console.warn('computeSeriesVowels returned a null/undefined vowel for', verb.id, vowels);
      }
      return vowels.join(' · ');
    }

    function renderVerb(verb) {
      // Treat preterite-present the same as irregular for rendering
      const verbForConjugate = verb.type === 'preterite-present'
        ? { ...verb, type: 'irregular' }
        : verb;
      const c = Paradigm.conjugate(verbForConjugate);

      const classLabel = c.class === 'Irregular' && verb.type === 'preterite-present'
        ? 'Preterite-Present'
        : (c.class || typeLabel(verb, null));
      const patternLabel = verb.type === 'strong' ? 'Ablaut series' : 'Stem pattern';
      const STEM_PATTERNS = {
        'Weak I': '-de / -te past',
        'Weak II': '-ode past · -ian infinitive',
      };
      const pattern = verb.type === 'strong'
        ? seriesVowelsLabel(verb)
        : (STEM_PATTERNS[classLabel] || '');

      const pi = c.presentInd || {};
      const pai = c.pastInd || {};
      const ps = c.presentSubj || {};
      const pas = c.pastSubj || {};
      const imp = c.imperative || {};
      const nf = c.nonFinite || {};

      const altPi = c.altPresentInd || null;
      const altPs = c.altPresentSubj || null;
      const hasDual = !!altPi;

      const dualColHeader = (col1, col2) =>
        `<tr>
          <td class="conj-label"></td>
          <td class="conj-col-head">${col1}</td>
          <td class="conj-col-head">${col2}</td>
        </tr>`;

      const presIndRows = hasDual
        ? dualColHeader('bēo–', 'eom–') +
        rowDual('1st sg.', pi.sg1, altPi.sg1) +
        rowDual('2nd sg.', pi.sg2, altPi.sg2) +
        rowDual('3rd sg.', pi.sg3, altPi.sg3) +
        rowDual('plural', pi.pl, altPi.pl)
        : row('1st sg.', pi.sg1) +
        row('2nd sg.', pi.sg2) +
        row('3rd sg.', pi.sg3) +
        row('plural', pi.pl);

      const pastIndRows =
        row('1st sg.', pai.sg1) +
        row('2nd sg.', pai.sg2) +
        row('3rd sg.', pai.sg3) +
        row('plural', pai.pl);

      const presSubjRows = hasDual && altPs
        ? dualColHeader('bēo–', 'eom–') +
        rowDual('singular', ps.sg, altPs.sg) +
        rowDual('plural', ps.pl, altPs.pl)
        : row('singular', ps.sg) +
        row('plural', ps.pl);

      const pastSubjRows =
        row('singular', pas.sg) +
        row('plural', pas.pl);

      const gridSections =
        section('Present Indicative', presIndRows, TIPS.pres_ind) +
        section('Past Indicative', pastIndRows, TIPS.past_ind) +
        section('Present Subjunctive', presSubjRows, TIPS.pres_subj) +
        section('Past Subjunctive', pastSubjRows, TIPS.past_subj);

      const tiles =
        tile('Infinitive', nf.infinitive, TIPS.infinitive) +
        tile('Inflected Infinitive', nf.inflectedInfinitive, TIPS.inf_infl) +
        tile('Present Participle', nf.presentParticiple, TIPS.pres_part) +
        tile('Past Participle', nf.pastParticiple, TIPS.past_part) +
        tile('Imperative Sg.', imp.sg, TIPS.imperative) +
        tile('Imperative Pl.', imp.pl, TIPS.imperative);

      return `<div class="verb-view">
        <div class="verb-header">
          <div class="verb-heading-row">
            <span class="verb-headword">${verb.lemma}</span>
            <span class="verb-gloss">${verb.gloss}</span>
          </div>
          <div class="verb-badges">
            <span class="tag ${tagClass(verb.type)}">${classLabel}</span>
            ${pattern ? `<span class="pattern-wrap">
              <span class="pattern-label">${patternLabel}:</span>
              <span class="tag-pattern">${pattern}</span>
            </span>` : ''}
          </div>
        </div>
        <div class="conj-grid">${gridSections}</div>
        <div class="nonfinite-section">
          <div class="nonfinite-head">Non-finite &amp; Imperative</div>
          <div class="tile-grid">${tiles}</div>
        </div>
        ${verb.notes ? `<div class="verb-notes"><p>${verb.notes}</p></div>` : ''}
        ${relatedIdsFor(verb).length ? `<div class="verb-sources">
          <span class="sources-label">Related</span>
          ${relatedIdsFor(verb).map(id => {
        const rel = verbs.find(v => v.id === id);
        return `<span class="tag-source tag-related" data-id="${id}" style="cursor:pointer">${rel ? rel.lemma : id}</span>`;
      }).join('')}
        </div>` : ''}
        ${verb.sources && verb.sources.length ? `<div class="verb-sources">
          <span class="sources-label">Sources</span>
          ${verb.sources.map(s =>
        `<span class="tag-source">${SOURCE_NAMES[s.text] || s.text} · Ch. ${s.chapter}</span>`
      ).join('')}
        </div>` : ''}
      </div>`;
    }

    function foldDiacritics(str) {
      return (str || '')
        .toLowerCase()
        .normalize('NFD')                 // ā→a+◌̄, ġ→g+◌̇, ǣ→æ+◌̄, ȳ→y+◌̄, etc.
        .replace(/[\u0300-\u036f]/g, '')  // strip combining marks (macrons, dots)
        .replace(/æ/g, 'ae')              // ash → ae (also catches decomposed ǣ)
        .replace(/þ/g, 'th')              // thorn → th
        .replace(/ð/g, 'th');             // eth  → th
    }

    function renderSidebar(filter) {
      const q = foldDiacritics(filter.trim());
      const matched = q
        ? verbs.filter(v =>
          foldDiacritics(v.lemma).includes(q) ||
          foldDiacritics(v.gloss).includes(q)
        )
        : verbs;

      const groups = [
        { label: 'Strong Verbs', types: ['strong'] },
        { label: 'Weak Verbs', types: ['weak1', 'weak2'] },
        { label: 'Other', types: ['preterite-present', 'irregular'] }
      ];

      let html = '';
      for (const g of groups) {
        const items = matched.filter(v => g.types.includes(v.type)).sort((a, b) => a.lemma.localeCompare(b.lemma));
        if (!items.length) continue;
        html += `<div class="sidebar-group"><span class="group-label">${g.label}</span>`;
        for (const v of items) {
          html += `<div class="verb-item${activeId === v.id ? ' active' : ''}" data-id="${v.id}">
            <span class="verb-oe">${v.lemma}</span>
            <span class="tag ${tagClass(v.type)}">${v.type === 'strong'
              ? ('Strong ' + (Paradigm.inferClass(v.principalParts, v) || ''))
              : v.type === 'weak1' ? 'Weak I'
                : v.type === 'weak2' ? 'Weak II'
                  : v.type === 'preterite-present' ? 'Pret.-Pres.'
                    : 'Irregular'
            }</span>
          </div>`;
        }
        html += `</div>`;
      }

      if (!html) {
        html = `<span class="no-results">No verbs match.</span>`;
      }

      document.getElementById('verb-list').innerHTML = html;
    }

    function selectVerb(id) {
      const verb = verbs.find(v => v.id === id);
      if (!verb) return;
      activeId = id;
      renderSidebar(document.getElementById('search-input').value);
      document.getElementById('main-content').innerHTML = renderVerb(verb);
      document.getElementById('main-content').scrollTop = 0;
      // On mobile the sidebar is a horizontal strip — scroll active item into view
      const activeEl = document.querySelector('.verb-item.active');
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    document.getElementById('main-content').addEventListener('click', e => {
      const rel = e.target.closest('.tag-related');
      if (rel) selectVerb(rel.dataset.id);
    });

    document.getElementById('sidebar').addEventListener('click', e => {
      const item = e.target.closest('.verb-item');
      if (item) selectVerb(item.dataset.id);
    });

    document.getElementById('search-input').addEventListener('input', e => {
      renderSidebar(e.target.value);
    });

    async function init() {
      try {
        const res = await fetch('verbs.json');
        if (!res.ok) throw new Error(res.statusText);
        verbs = await res.json();
        familyMap = Paradigm.buildFamilies(verbs);
        renderSidebar('');
        const hash = window.location.hash.slice(1);
        const initial = (hash && verbs.find(v => v.id === hash)) || verbs[0];
        if (initial) selectVerb(initial.id);
      } catch (err) {
        document.getElementById('main-content').innerHTML =
          `<div class="placeholder">Could not load verbs.json.<br>
          Run <code>python3 -m http.server 8000</code> in this directory,<br>
          then open <code>http://localhost:8000</code></div>`;
      }
    }

    function initTooltips() {
      const tip = document.createElement('div');
      tip.className = 'oe-tooltip';
      document.body.appendChild(tip);

      let showTimer = null;

      document.getElementById('main-content').addEventListener('mouseover', e => {
        const el = e.target.closest('[data-tip]');
        if (!el) return;
        clearTimeout(showTimer);
        showTimer = setTimeout(() => {
          tip.textContent = el.dataset.tip;
          const r = el.getBoundingClientRect();
          let top = r.bottom + 8;
          let left = r.left;
          const tw = tip.offsetWidth;
          const th = tip.offsetHeight;
          if (left + tw > window.innerWidth - 12) left = window.innerWidth - tw - 12;
          if (top + th > window.innerHeight - 12) top = r.top - th - 8;
          tip.style.left = left + 'px';
          tip.style.top = top + 'px';
          tip.style.opacity = '1';
        }, 200);
      });

      document.getElementById('main-content').addEventListener('mouseout', e => {
        const el = e.target.closest('[data-tip]');
        if (!el) return;
        clearTimeout(showTimer);
        tip.style.opacity = '0';
      });
    }

    init();
    initTooltips();
  </script>
  <script src="components.js"></script>
</body>

</html>
